; SkinFlow preset: High detail
; A finer simulation grid: smoother sheen and wet trails, smaller blotches.
; To use it, copy the lines below over the same lines in SKSE/Plugins/SkinFlow.ini
; (or set Sweat spots, Water left behind and Simulation detail in the F1 menu, then edit
; iMaxResolution in the ini). iMaxResolution needs a restart; the rest applies while the game runs.
;
; Cost: about 25-40 MB of video memory per sweating adult instead of 10-15 MB
; (about 350 MB with a full pool of 48 body parts), and more GPU time per actor.
;
; fPoreShare and fResidual are lowered with the cell size, so beads keep about the same
; spacing and runs about the same length as with the defaults.

[General]
iMaxResolution=1024

[Simulation]
fCellSize=0.18
fPoreShare=0.04
fResidual=0.02
