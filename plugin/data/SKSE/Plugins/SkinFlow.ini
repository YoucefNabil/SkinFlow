[General]
; 0 = off, 1 = on (restart)
bEnabled=1
; 0 = sweat, 1 = gravity debug colours on skin, 2 = simulated water heat map (applies while the game runs)
iDebugView=0
; largest simulated surface in texels per side (restart); each body part gets the size that gives it fCellSize
iMaxResolution=512
; actor + UV layout pairs simulated at once, head and body of one actor = 2 (restart)
iMaxSurfaces=12
; frames between stats lines in SkinFlow.log, 0 = off (restart)
iStatsInterval=600

[Look]
; Saved changes here apply within a second while the game runs.
; sweat on every simulated actor, 0..1 (drives the simulated sweat; test value until exertion drives it; Advanced Skin's exertion sweat adds to it)
fAmount=0.3
; drawn drop size multiplier (the simulation decides where drops are)
fDropSize=0.8
; 0..1 gloss of the film the water leaves on the skin
fSheen=1

[Simulation]
; How sweat comes out, runs and dries. Re-read within a second when saved.
; Water per square world unit and second at full sweat (pores, most of it on a few spots).
fSweatRate=1.42
; Share of the skin that sweats, 0.02 - 1: lower = fewer beads, further apart, each filling faster.
fPoreShare=0.15
; World units per second of a drop running down vertical skin.
fRunSpeed=0.7
; Water drying per square world unit and second.
fEvaporation=0.05
; Water a running drop leaves on each texel it crosses (the wet trail film), 0 - 0.5.
fResidual=0.05
; World units per simulated texel: the size of one simulated drop, the same on every body part.
; Changing it restarts the simulation on every surface.
fCellSize=0.25
